name: 🐛 Bug Report
description: Report something that is broken or not working as expected
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! The more details you provide, the faster we can fix it.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clearly describe the problem
      placeholder: "When I click X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Help us recreate the issue
      placeholder: |
        1. Go to...
        2. Click...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "It should have..."

  - type: dropdown
    id: severity
    attributes:
      label: How severe is this issue?
      options:
        - 🔥 Blocking (cannot use the app)
        - ⚠️ Major (core feature affected)
        - 😕 Minor (inconvenience)
        - 💅 Cosmetic (visual issue)
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other

  - type: input
    id: browser_version
    attributes:
      label: Browser version (if known)
      placeholder: "e.g. 121.0.6167.140"

  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop
        - Tablet
        - Mobile

  - type: textarea
    id: console
    attributes:
      label: Console errors (if any)
      description: Open DevTools → Console and paste errors
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: Drag and drop images here if helpful

  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues
          required: true
        - label: I can reproduce this issue consistently